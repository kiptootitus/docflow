version: "3.9"

services:
  # ----------------------------
  # POSTGRES DATABASE
  # ----------------------------
  db:
    image: postgres:16-alpine
    container_name: docflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docflow254}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docflow_network

  # ----------------------------
  # REDIS
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: docflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_strong_password_2026}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret_strong_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docflow_network

  # ----------------------------
  # DJANGO BACKEND
  # ----------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow_backend
    restart: unless-stopped
    command: gunicorn docflow.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile -
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docflow.settings
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docflow_network

  # ----------------------------
  # CELERY WORKER
  # ----------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow_celery
    restart: unless-stopped
    command: celery -A docflow worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docflow.settings
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docflow_network

  # ----------------------------
  # CELERY BEAT
  # ----------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow_beat
    restart: unless-stopped
    command: celery -A docflow beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docflow.settings
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docflow_network

  # ----------------------------
  # FLOWER (CELERY MONITOR)
  # ----------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow_flower
    restart: unless-stopped
    command: celery -A docflow flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docflow.settings
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      celery_worker:
        condition: service_started
    networks:
      - docflow_network

  # ----------------------------
  # REACT FRONTEND (FIXED NAME)
  # ----------------------------
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: docflow_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - docflow_network

  # ----------------------------
  # NGINX
  # ----------------------------
  nginx:
    image: nginx:alpine
    container_name: docflow_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - docflow_network

# ----------------------------
# VOLUMES
# ----------------------------
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

# ----------------------------
# NETWORK
# ----------------------------
networks:
  docflow_network:
    driver: bridge